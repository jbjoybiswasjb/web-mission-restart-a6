<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title. -->
    <title>SwiftCraft</title>

    <!-- Fontawesome. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Tailwind+DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font integration. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- Stylesheet. -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="px-4">


    <!-- Header section. -->
    <header>


        <!-- Navbar -->
        <nav>
            <div class="navbar bg-base-100 shadow-sm">

                <!-- Icon -->
                <div class="navbar-start">
                    <a class="btn btn-ghost text-xl text-[#1877F2]">SwiftCraft</a>
                </div>

                <!-- Menu -->
                <div class="navbar-center hidden lg:flex">
                    <ul class="menu menu-horizontal px-1">
                        <li><a class="hover:text-[#1877F2]">Home</a></li>
                        <li><a class="hover:text-[#1877F2]">Products</a></li>
                        <li><a class="hover:text-[#1877F2]">About</a></li>
                        <li><a class="hover:text-[#1877F2]">Contact</a></li>
                    </ul>
                </div>

                <!-- Cart. -->
                <div class="navbar-end">
                    <a class="btn"><i class="fa-solid fa-cart-arrow-down"></i></a>
                </div>

                <!-- DropDown. -->
                <div class="dropdown">
                    <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h8m-8 6h16" />
                        </svg>
                    </div>
                    <ul tabindex="-1"
                        class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
                        <li><a class="hover:text-[#1877F2]">Home</a></li>
                        <li><a class="hover:text-[#1877F2]">Products</a></li>
                        <li><a class="hover:text-[#1877F2]">About</a></li>
                        <li><a class="hover:text-[#1877F2]">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Banner. -->
        <div class="hero"
            style="background-image: url(/Assets/images/banner-image.png);">
            <div class="hero-overlay"></div>
            <div class="hero-content text-neutral-content text-center py-40">
                <div class="max-w-screen-md">
                    <h1 class="mb-5 text-5xl font-bold">Best Collection For You</h1>
                    <p class="mb-5">
                        Discover the latest trend in fashion, electronics and more. Shop with confidence and style at SwiftCraft.
                    </p>
                    <button class="btn btn-primary">Shop Now</button>
                </div>
            </div>
        </div>

    </header>


</body>

</html>
